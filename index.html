<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Hyper Menu</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app" class="hidden">
    <div class="backdrop"></div>

    <main class="panel">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark">H</div>
          <div>
            <h1>Hyper Menu</h1>
            <span id="version">2.0.0</span>
          </div>
        </div>
        <button id="close" class="close">×</button>
      </header>

      <section id="loading" class="screen">
        <div class="loader"></div>
        <h2>Hyper Menu</h2>
        <p>Carregando configuração...</p>
      </section>

      <section id="link" class="screen hidden">
        <div class="server-card">
          <img id="serverLogo" alt="Logo" onerror="this.style.display='none'">
          <div>
            <small>GRUPO DETECTADO</small>
            <h2 id="serverName">Sem Grupo</h2>
            <p id="serverId">default</p>
          </div>
        </div>

        <div class="user-card">
          <div>
            <small>USUÁRIO</small>
            <strong id="username">-</strong>
          </div>
          <div class="code">
            <small>CÓDIGO</small>
            <strong id="code">HYPER----</strong>
          </div>
        </div>

        <button id="linkButton" class="primary">Vincular Menu</button>
        <p id="status" class="status"></p>
      </section>

      <section id="menu" class="hidden">
        <div class="dashboard">
          <div class="welcome">
            <small>HYPER MENU</small>
            <h2>Olá, <span id="menuUser">-</span></h2>
            <p id="menuGroup">Sem Grupo</p>
          </div>
          <div class="pill" id="accessPill">LIBERADO</div>
        </div>

        <nav class="tabs">
          <button class="tab active" data-tab="home">Início</button>
          <button class="tab" data-tab="players">Jogadores</button>
          <button class="tab" data-tab="settings">Configurações</button>
        </nav>

        <div class="content">
          <div id="tab-home" class="tab-content">
            <div class="grid">
              <div class="stat"><small>Servidor</small><b id="statServer">-</b></div>
              <div class="stat"><small>Jogadores</small><b id="statPlayers">0</b></div>
              <div class="stat"><small>Anti-cheat</small><b id="statAc">-</b></div>
            </div>
          </div>

          <div id="tab-players" class="tab-content hidden">
            <div id="players" class="players"></div>
          </div>

          <div id="tab-settings" class="tab-content hidden">
            <button class="action" data-action="fecharMenu">Fechar Menu</button>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
